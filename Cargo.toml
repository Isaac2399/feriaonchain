[package]
name = "sena-feria"
version = "0.1.0"
edition = "2021"
publish = false
description = "Farmers-market deposit: the contract holds the funds until delivery, refund, or expiry."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "22.0.11"

[dev-dependencies]
soroban-sdk = { version = "22.0.11", features = ["testutils"] }
# soroban-env-host 22 declara ed25519-dalek ">=2". Sin este tope, Cargo
# reciente elige la 3.x y ese SDK deja de compilar.
ed25519-dalek = "=2.2.0"

# Ajustes que usa Soroban al compilar el contrato a Wasm.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
lto = true
panic = "abort"
codegen-units = 1

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
